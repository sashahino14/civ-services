name: Build Android APK (ARMv7)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Initialize Capacitor
        run: |
          npx cap init "CIV Services" "com.civservices.app" --web-dir www
          npx cap add android

      - name: Add GPS permission to AndroidManifest.xml
        run: |
          cd android/app/src/main
          if ! grep -q "ACCESS_FINE_LOCATION" AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' AndroidManifest.xml
          fi

      - name: Configure ABI splits (ARMv7 only)
        run: |
          cd android
          sed -i '/android {/a \ \ \ \ splits {\n        abi {\n            enable true\n            reset()\n            include "armeabi-v7a"\n            universalApk false\n        }\n    }' app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: CIVServices-ARMv7-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk