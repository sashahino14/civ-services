name: Build Android APK (ARMv7)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Update v3 -> v4
        with:
          node-version: 20 # Utilise la version 20 pour plus de stabilité

      - name: Install dependencies
        run: npm install # 'npm ci' nécessite un package-lock.json parfait

      - name: Setup Java 17
        uses: actions/setup-java@v4 # Update v3 -> v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor
        run: |
          npx cap init "CIV Services" "com.civservices.app" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Configure Android Permissions
        run: |
          # Ajout des permissions de localisation et de stockage (MANAGE_EXTERNAL_STORAGE pour le scan)
          cd android/app/src/main
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' AndroidManifest.xml
          # Activation du Legacy Storage
          sed -i '/<application/s/<application/<application android:requestLegacyExternalStorage="true"/' AndroidManifest.xml

      - name: Configure ABI splits (ARMv7 32-bit only)
        run: |
          cd android
          sed -i '/android {/a \    splits {\n        abi {\n            enable true\n            reset()\n            include "armeabi-v7a"\n            universalApk false\n        }\n    }' app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4 # LA CORRECTION CRITIQUE
        with:
          name: WhatsStat-Cyber-32bit-Build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk