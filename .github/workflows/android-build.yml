name: Build Android APK (32-bit & 64-bit)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor
        run: |
          npx cap init "CIV Services" "com.civservices.app" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Configure Android Permissions
        run: |
          cd android/app/src/main
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' AndroidManifest.xml
          sed -i '/<application/s/<application/<application android:requestLegacyExternalStorage="true"/' AndroidManifest.xml

      - name: Configure ABI splits for 32-bit & 64-bit
        run: |
          cd android
          # Modifie la configuration pour inclure les deux architectures
          sed -i '/android {/a \    splits {\n        abi {\n            enable true\n            reset()\n            include "armeabi-v7a", "arm64-v8a"\n            universalApk false\n        }\n    }' app/build.gradle

      - name: Build APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload 32-bit APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: CIVServices-32bit-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload 64-bit APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: CIVServices-64bit-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk