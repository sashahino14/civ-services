<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CIV Services - Annuaire proche de vous</title>

  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <meta name="theme-color" content="#2c3e50">

  <link rel="stylesheet" href="libs/leaflet/leaflet.css" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id=\"loader-container\" class=\"hidden\">
  <div class=\"spinner\"></div>
  <span>Recherche en cours...</span>
</div>

<div id="app">
  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Ex: pharmacie près de la gare, hôpital Yopougon..." />
    <button id="search-btn"><i class="fas fa-search"></i></button>
  </div>

  <div id="quick-buttons">
    <button class="cat-btn" data-cat="hospital"><i class="fas fa-hospital"></i> Hôpitaux</button>
    <button class="cat-btn" data-cat="pharmacy"><i class="fas fa-prescription-bottle-medical"></i> Pharmacies</button>
    <button class="cat-btn" data-cat="school"><i class="fas fa-school"></i> Écoles</button>
    <button class="cat-btn" data-cat="fuel"><i class="fas fa-gas-pump"></i> Essence</button>
    <button class="cat-btn" data-cat="market"><i class="fas fa-shopping-cart"></i> Commerces</button>
    <button class="cat-btn" data-cat="public"><i class="fas fa-landmark"></i> Publics</button>
  </div>

  <div id="map"></div>

  <div class="floating-controls">
    <div id="locate-btn" title="Me géolocaliser"><i class="fas fa-location-crosshairs"></i></div>
    <div id="favorites-btn" title="Mes Favoris"><i class="fas fa-star"></i></div>
    <div id="urgence-btn" title="Numéros d'urgence"><i class="fas fa-phone-flip"></i></div>
    <div id="signalement-btn" title="Signaler un problème"><i class="fas fa-flag"></i></div>
  </div>

  <div id="results-panel">
    <div class="panel-header">
      <span id="panel-title">Résultats de recherche</span>
      <span id="close-panel" class="close-btn">&times;</span>
    </div>
    <div id="results-list" class="panel-body"></div>
  </div>

  <div id="favorites-panel" class="side-panel">
    <div class="side-panel-header">
      <h3><i class="fas fa-star"></i> Mes Favoris</h3>
      <span id="close-favorites" class="close-btn">&times;</span>
    </div>
    <div id="favorites-list" class="side-panel-body">
      </div>
  </div>
</div>

<div id="urgence-modal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <h3><i class="fas fa-phone-alt"></i> Numéros d'Urgence (Côte d'Ivoire)</h3>
    <ul class="urgence-list">
      <li><i class="fas fa-fire-extinguisher"></i> Sapeurs Pompiers : <a href="tel:18">18</a></li>
      <li><i class="fas fa-shield-alt"></i> Police Nationale : <a href="tel:17">17</a></li>
      <li><i class="fas fa-truck-medical"></i> SAMU : <a href="tel:15">15</a></li>
      <li><i class="fas fa-gendarmerie"></i> Gendarmerie : <a href="tel:101">101</a></li>
    </ul>
  </div>
</div>

<div id="signalement-modal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <h3><i class="fas fa-flag"></i> Signaler un problème</h3>
    <form id="signalement-form">
      <label>Type d'incident :</label>
      <select id="incident-type" required>
        <option value="incendie">Incendie</option>
        <option value="accident">Accident de la route</option>
        <option value="incivilite">Incitoyenneté / dégradation</option>
        <option value="route">Nid-de-poule / voirie</option>
        <option value="autre">Autre</option>
      </select>
      <label>Description :</label>
      <textarea id="description" rows="3" placeholder="Décrivez précisément..." required></textarea>
      <label>Photo (facultative) :</label>
      <input type="file" id="photo" accept="image/*">
      <button type="submit" id="submit-signalement">Envoyer le signalement</button>
    </form>
    <div id="signalement-status"></div>
  </div>
</div>

<script src="libs/leaflet/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
