<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a7e3d">
    <meta name="description" content="CIV Services – Trouvez rapidement tous les services utiles en Côte d'Ivoire.">
    <title>CIV Services</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" sizes="any" type="image/png">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app">
        
        <header id="app-header">
            <img src="logo.png" alt="Logo CIV Services" id="app-logo">
        </header>

        <div id="category-menu-container"></div>

        <main id="map-container" aria-label="Carte interactive des services"></main>

        <button id="locate-btn" aria-label="Me localiser">
            <i class="fas fa-crosshairs" aria-hidden="true"></i>
        </button>

        <button id="emergency-btn" aria-label="Ouvrir les numéros d'urgence">
            <i class="fas fa-phone-alt" aria-hidden="true"></i>
        </button>

        <!-- Barre de navigation mise à jour -->
        <nav id="bottom-nav" aria-label="Navigation principale">
            <button class="nav-item active" data-screen="home">
                <span class="nav-icon"><i class="fas fa-home" aria-hidden="true"></i></span>
                <span class="nav-label">Accueil</span>
            </button>
            <button class="nav-item" data-screen="map">
                <span class="nav-icon"><i class="fas fa-map-location-dot" aria-hidden="true"></i></span>
                <span class="nav-label">Carte</span>
            </button>
            <!-- Nouveau bouton Objets Trouvés -->
            <button class="nav-item" data-screen="lost-found">
                <span class="nav-icon"><i class="fas fa-box-open" aria-hidden="true"></i></span>
                <span class="nav-label">Objets</span>
            </button>
            <button class="nav-item" data-screen="emergency">
                <span class="nav-icon"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i></span>
                <span class="nav-label">Urgence</span>
            </button>
        </nav>

        <!-- Modale d'urgence (existante) -->
        <div id="emergency-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="emergency-title" aria-hidden="true">
            <div class="modal-content">
                <button id="emergency-close" class="modal-close" aria-label="Fermer la modale">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <h2 id="emergency-title"><i class="fas fa-phone-alt" style="margin-right: 8px;" aria-hidden="true"></i>Numéros d'urgence</h2>
                <ul id="emergency-list"></ul>
            </div>
        </div>

        <!-- Nouvelle Modale : Objets Perdus / Trouvés -->
        <div id="lost-found-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="lost-found-title" aria-hidden="true">
            <div class="modal-content">
                <button id="lost-found-close" class="modal-close" aria-label="Fermer la modale">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <h2 id="lost-found-title"><i class="fas fa-box-open" style="margin-right: 8px;" aria-hidden="true"></i>Objets Perdus / Trouvés</h2>
                
                <!-- Formulaire d'ajout -->
                <form id="lost-found-form" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="lf-title" placeholder="Nom de l'objet (ex: Clés, Téléphone...)" required style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    <textarea id="lf-desc" placeholder="Description détaillée (couleur, marque...)" required style="padding: 8px; border: 1px solid #ddd; border-radius: 5px; resize: vertical;"></textarea>
                    <input type="text" id="lf-location" placeholder="Lieu (ex: Cocody, Yamoussoukro...)" required style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    <input type="tel" id="lf-contact" placeholder="Votre numéro de téléphone" required style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    <button type="submit" style="padding: 10px; background: #0a7e3d; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Publier l'annonce</button>
                </form>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

                <!-- Liste des annonces -->
                <h3 style="font-size: 16px; margin-bottom: 10px;">Annonces récentes</h3>
                <div id="lost-found-list" style="max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                    <!-- Les annonces seront injectées ici par JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <noscript>
        <div style="padding: 20px; text-align: center; color: red;">
            Veuillez activer JavaScript pour utiliser CIV Services.
        </div>
    </noscript>

    <script type="module" src="js/main.js"></script>
</body>
</html>
